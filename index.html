<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг цен — доступ по ключу</title>
<style>
  :root { color-scheme: light; --bg:#f5f6f8; --card:#fff; --ink:#14161a; --muted:#6b7280;
          --line:#e6e8ec; --win:#0f7b4f; --err:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); padding:24px;
         font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .gate { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:28px; width:100%; max-width:380px; box-shadow:0 8px 30px rgba(16,24,40,.08); }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:-.01em; }
  .note { color:var(--muted); font-size:13px; margin:0 0 18px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  input { display:block; width:100%; margin-top:6px; font:inherit; font-size:16px;
          letter-spacing:.08em; padding:11px 13px; border:1px solid var(--line); border-radius:9px; }
  input:focus { outline:2px solid var(--win); outline-offset:1px; }
  button { width:100%; font:inherit; font-size:14px; font-weight:500; cursor:pointer;
           padding:12px; border-radius:9px; border:1px solid var(--win);
           background:var(--win); color:#fff; }
  button:hover { background:#0c6642; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--err); font-size:13px; margin:0 0 14px; }
  .spin { color:var(--muted); font-size:13px; margin:14px 0 0; text-align:center; }
  /* Подпись о доступе живёт внутри отчёта, но стиль задаём здесь: страница
     вставляет его в шапку отчёта при открытии. */
  .access { color:#0f7b4f; font-weight:600; }
  #report { width:100%; }
  #report iframe { width:100%; height:100vh; border:0; display:block; }
  body.showing { display:block; padding:0; background:#fff; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>Мониторинг цен</h1>
  <p class="note" id="note">Введите ключ доступа. Он действует 30 дней с момента выдачи.</p>
  <form id="form" autocomplete="off">
    <label>Ключ доступа
      <input name="key" id="key" required autofocus placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false">
    </label>
    <button type="submit" id="submit">Открыть отчёт</button>
  </form>
  <p class="spin" id="spin" hidden>Проверяю ключ…</p>
</div>
<div id="report" hidden></div>

function fromBase64(text) {
  var binary = atob(text);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function normalize(value) {
  // Сначала убираем разделители, потом поднимаем регистр. Обратный порядок
  // ломает кириллицу: латинский диапазон A-Z её не покрывает, и код «САША»
  // превратился бы в пустую строку. Буквы и цифры берём в любом регистре,
  // поэтому подходят и «саша», и «САША», и «Саша».
  return String(value || "").replace(/[^\p{L}\p{N}]/gu, "").toUpperCase();
}

async function tryOpen(payload, password) {
  var raw = fromBase64(payload.blob);
  var version = raw[0];
  if (version !== 1) return null;
  var salt = raw.slice(1, 17);
  var nonce = raw.slice(17, 29);
  var rounds = (raw[29] << 24) | (raw[30] << 16) | (raw[31] << 8) | raw[32];
  var tag = raw.slice(33, 65);
  var body = raw.slice(65);

  var material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(normalize(password)), "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: rounds, hash: "SHA-256" }, material, 256);
  var master = new Uint8Array(bits);

  // Ключ проверки — весь вывод PBKDF2, ключ шифрования — его первые 16 байт.
  // Ровно так же считает сторона сборки, поэтому ключи совпадают.
  var macKey = await crypto.subtle.importKey(
    "raw", master, { name: "HMAC", hash: "SHA-256" }, false, ["verify", "sign"]);
  var signed = new Uint8Array(salt.length + nonce.length + body.length);
  signed.set(salt, 0);
  signed.set(nonce, salt.length);
  signed.set(body, salt.length + nonce.length);
  if (!await crypto.subtle.verify("HMAC", macKey, tag, signed)) return null;

  var encKey = await crypto.subtle.importKey(
    "raw", master.slice(0, 16), { name: "AES-GCM" }, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: nonce, additionalData: salt, tagLength: 128 }, encKey, body);
  return new TextDecoder().decode(plain);
}

function show(html, access) {
  // Дату доступа подставляем в шапку отчёта: она у каждого покупателя своя,
  // поэтому в зашифрованном отчёте её быть не может — только из данных ключа.
  if (access) {
    var marked = html.replace("</p>",
      '<span class="dot">·</span><span class="access">' + access + "</span></p>");
    if (marked !== html) html = marked;
  }
  var frame = document.createElement("iframe");
  frame.setAttribute("sandbox", "allow-scripts allow-downloads allow-modals");
  frame.srcdoc = html;
  document.getElementById("report").appendChild(frame);
  document.getElementById("report").hidden = false;
  document.getElementById("gate").hidden = true;
  document.body.classList.add("showing");
  try { sessionStorage.setItem("dsh-report", JSON.stringify({ html: html, access: access })); }
  catch (error) {}
}

async function trySession() {
  try {
    var saved = sessionStorage.getItem("dsh-report");
    if (!saved) return false;
    var data = JSON.parse(saved);
    show(data.html, data.access);
    return true;
  } catch (error) {}
  return false;
}

document.getElementById("form").addEventListener("submit", async function (event) {
  event.preventDefault();
  var key = document.getElementById("key").value;
  var button = document.getElementById("submit");
  var spin = document.getElementById("spin");
  var note = document.getElementById("note");
  button.disabled = true;
  spin.hidden = false;
  note.hidden = true;

  for (var i = 0; i < PAYLOADS.length; i++) {
    try {
      var html = await tryOpen(PAYLOADS[i], key);
      if (html) { show(html, PAYLOADS[i].access); return; }
    } catch (error) {
      // Ключ не подошёл к этой копии — пробуем следующую.
    }
  }

  button.disabled = false;
  spin.hidden = true;
  note.hidden = false;
  note.className = "err";
  note.textContent = "Ключ не подошёл. Проверьте написание или срок действия.";
});

(async function () { await trySession(); })();
</script>
